<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>To-Do Board</title>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <main class="page">

      <header class="top">
        <div>
          <h1>To-Do Board</h1>
          <p class="sub">{{ summary }}</p>
        </div>
        <div class="tools">
          <label for="sort">Sort by</label>
          <select id="sort" v-model="sortBy">
            <option value="added">Order added</option>
            <option value="due">Due date</option>
          </select>
          <button type="button" class="link" :disabled="!doneCount" @click="clearCompleted">Clear completed</button>
        </div>
      </header>

      <form class="add" @submit.prevent="addTodo">
        <div class="field grow">
          <label for="new-title">Title</label>
          <input id="new-title" type="text" placeholder="What needs doing?" autocomplete="off" maxlength="100" v-model="title">
        </div>
        <div class="field">
          <label for="new-due">Due date <span class="opt">(optional)</span></label>
          <input id="new-due" type="date" v-model="newDue">
        </div>
        <div class="field full">
          <label for="new-desc">Description <span class="opt">(optional)</span></label>
          <textarea id="new-desc" rows="2" maxlength="500" placeholder="Add details, notes or steps" v-model="description"></textarea>
        </div>
        <button class="primary push" type="submit" :disabled="!title.trim()">Add task</button>
      </form>

      <div class="board">
        <section v-for="c in columns" :key="c.key" class="col" :class="[c.key, { droppable: c.status && dragging, over: overCol === c.key }]"
                 :aria-labelledby="'h-' + c.key"
                 @dragover="onDragOver($event, c)" @dragleave="onDragLeave($event, c)" @drop.prevent="onDrop(c)">
          <div class="col-head">
            <h2 :id="'h-' + c.key"><span class="dot"></span>{{ c.title }}</h2>
            <span class="count">{{ c.tasks.length }}</span>
          </div>
          <p class="caption">{{ c.caption }}</p>

          <transition-group name="list" tag="ul" class="list">
            <todo-item v-for="t in c.tasks" :key="t.id"
                       :todo="t" :today="todayISO" :show-status="c.key === 'all'"
                       :class="{ dragging: dragging && dragging.id === t.id && dragging.from === c.key }"
                       @toggle="toggleTodo" @remove="removeTodo" @update="updateTodo" @move="moveTodo"
                       @dragstart="dragStart($event, t, c.key)" @dragend="dragEnd"></todo-item>
          </transition-group>

          <p class="empty" v-if="!c.tasks.length">{{ c.empty }}</p>
        </section>
      </div>

    </main>
  </div>

  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="TodoItem.js"></script>
  <script src="app.js"></script>
</body>
</html>
